<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RF Controller</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#5b6470;--line:#d8dde3;--accent:#1f6feb;--bad:#c62828;--ok:#2e7d32}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1b1f24;--text:#e8eaed;--muted:#9aa3ad;--line:#2f353c;--accent:#58a6ff;--bad:#ff6b6b;--ok:#6ccf76}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.big{font-size:28px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
input[type=range]{width:100%;padding:0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:4px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right}
form{display:grid;gap:8px}
label{display:grid;gap:2px;color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#msg{min-height:1.4em}
.bad{color:var(--bad)}.ok{color:var(--ok)}
</style>
</head>
<body>
<main>
<h1>RF Controller</h1>
<p id="msg" role="status"></p>
<div class="grid">
<div class="card">
<h2>RF filter</h2>
<div class="row" id="filters"></div>
</div>
<div class="card">
<h2>Fan</h2>
<div class="big"><span id="rpm">–</span> <span class="muted" style="font-size:15px">RPM</span></div>
<p class="muted">Duty <span id="duty">–</span>%</p>
<input id="fanSlider" type="range" min="0" max="100" step="1" aria-label="Fan speed percent">
<div class="row"><span id="fanTarget" class="muted"></span><button id="fanSet">Set</button></div>
</div>
<div class="card">
<h2>Temperature</h2>
<table id="temps"></table>
</div>
<div class="card">
<h2>Device</h2>
<table id="device"></table>
</div>
</div>

<div class="grid" style="margin-top:12px">
<div class="card">
<h2>Network (applies after reboot)</h2>
<form id="netForm">
<label>Hostname<input id="hostname" maxlength="63"></label>
<label>NTP server<input id="ntp" maxlength="253"></label>
<label class="row" style="display:flex;color:var(--text)"><input id="dhcp" type="checkbox"> Use DHCP</label>
<label>Address<input id="address"></label>
<label>Netmask<input id="netmask"></label>
<label>Gateway<input id="gateway"></label>
<label>DNS<input id="dns"></label>
<div class="row"><button>Save</button></div>
</form>
</div>
<div class="card">
<h2>System</h2>
<p class="muted">This session is authenticated by your management client certificate.</p>
<div class="row"><button id="reboot">Reboot</button></div>
</div>
</div>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
let editingFan=false;
function msg(text,bad){$('msg').textContent=text||'';$('msg').className=bad?'bad':'ok'}
async function api(method,path,body,headers){
  const opt={method,headers:Object.assign({},headers||{}),cache:'no-store'};
  if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}
  const r=await fetch(path,opt);
  const type=r.headers.get('Content-Type')||'';
  const data=type.startsWith('application/json')?await r.json():await r.text();
  if(!r.ok)throw new Error(typeof data==='string'&&data?data:('HTTP '+r.status));
  return data;
}
function row(table,label,value){const tr=table.insertRow();tr.insertCell().textContent=label;tr.insertCell().textContent=value}
function render(s){
  const f=$('filters');
  if(!f.children.length)for(let i=1;i<=4;i++){const b=document.createElement('button');b.textContent='Filter '+i;b.dataset.port=i;b.onclick=()=>api('PUT','/api/v1/rf/filter',{filter:i}).then(()=>{msg('Filter '+i+' selected');refresh()}).catch(e=>msg(e.message,true));f.appendChild(b)}
  for(const b of f.children){const on=+b.dataset.port===s.rf.filter;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)}
  $('rpm').textContent=s.fan.rpm===null?'no tach':s.fan.rpm;
  $('duty').textContent=s.fan.percent;
  if(!editingFan){$('fanSlider').value=s.fan.percent;$('fanTarget').textContent=''}
  const t=$('temps');t.textContent='';
  if(!s.temperature.sensors.length)row(t,'No sensors','');
  for(const x of s.temperature.sensors)row(t,x.source==='internal'?'ESP32-S3 (internal)':x.id,x.ok?x.celsius.toFixed(1)+' °C':'not responding');
  const d=$('device');d.textContent='';
  row(d,'Hostname',s.device.hostname);row(d,'IPv4',s.device.ipv4||'none');row(d,'Firmware',s.device.firmware);
  row(d,'Uptime',Math.floor(s.system.uptime_ms/1000)+' s');row(d,'Time',s.time.synchronized?new Date(s.time.unix_time*1000).toISOString().replace('.000',''):'not synchronised');
  row(d,'Last reset',s.system.reset_reason);row(d,'Server certificate',s.console.server_certificate);row(d,'Free internal heap',s.system.heap_internal_free+' bytes');
}
let busy=false;
async function refresh(){if(busy)return;busy=true;try{render(await api('GET','/api/v1/status'))}catch(e){msg(e.message,true)}finally{busy=false}}
async function loadConfig(){
  try{const c=await api('GET','/api/v1/config');
    $('hostname').value=c.hostname;$('ntp').value=c.ntp_server;$('dhcp').checked=c.network.dhcp;
    for(const k of['address','netmask','gateway','dns'])$(k).value=c.network[k];syncDhcp()}catch(e){msg(e.message,true)}
}
function syncDhcp(){for(const k of['address','netmask','gateway','dns'])$(k).disabled=$('dhcp').checked}
$('dhcp').onchange=syncDhcp;
$('fanSlider').oninput=()=>{editingFan=true;$('fanTarget').textContent='Set to '+$('fanSlider').value+'%'};
$('fanSet').onclick=()=>api('PUT','/api/v1/fan',{percent:+$('fanSlider').value}).then(f=>{editingFan=false;msg('Fan set to '+f.percent+'%');refresh()}).catch(e=>msg(e.message,true));
$('netForm').onsubmit=async e=>{e.preventDefault();
  try{await api('PUT','/api/v1/config/hostname',{hostname:$('hostname').value});
    await api('PUT','/api/v1/config/ntp',{server:$('ntp').value});
    const n=$('dhcp').checked?{dhcp:true}:{dhcp:false,address:$('address').value,netmask:$('netmask').value,gateway:$('gateway').value,dns:$('dns').value};
    await api('PUT','/api/v1/config/network',n);msg('Saved. Reboot to apply.')}catch(err){msg(err.message,true)}};
$('reboot').onclick=()=>{if(!confirm('Reboot the controller?'))return;
  api('POST','/api/v1/system/reboot',undefined,{'X-Confirm-Reboot':'REBOOT'}).then(()=>msg('Rebooting…')).catch(e=>msg(e.message,true))};
loadConfig();refresh();setInterval(refresh,1000);
</script>
</body>
</html>
