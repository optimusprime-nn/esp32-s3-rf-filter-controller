name: ESP-IDF Build
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    # The runner group allowlists this workflow on main only, and it cannot match other refs by wildcard.
    runs-on: ${{ github.ref == 'refs/heads/main' && fromJSON('["self-hosted","Linux","X64","big"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE:/project"             -w /project             gcc:14             sh tests/host/run.sh
      - name: Build firmware (ESP-IDF v6.1)
        run: |
          docker run --rm \
            -e IDF_TARGET=esp32s3 \
            -e IDF_GIT_SAFE_DIR=/project \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            espressif/idf:v6.1 \
            idf.py build size
      - name: Upload firmware and build configuration
        uses: actions/upload-artifact@v4
        with:
          name: rf-controller-esp32s3-idf-v6.1
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
            sdkconfig
          if-no-files-found: error
      - name: Return build output to the runner user
        if: always()
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE:/project"             espressif/idf:v6.1             chown -R "$(id -u):$(id -g)" /project

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rf-controller-esp32s3-idf-v6.1
          path: fw
      - name: Package firmware
        run: |
          name="rf-controller-esp32s3-${GITHUB_REF_NAME}"
          (cd fw && zip -r "../${name}.zip" .)
          sha256sum "${name}.zip" > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" rf-controller-esp32s3-*.zip SHA256SUMS.txt --clobber
